name: Atualizar painel

on:
  schedule:
    # Horários em UTC. O Brasil está em UTC-3, então:
    #   11:00 UTC = 08h · 15:00 UTC = 12h · 21:00 UTC = 18h
    - cron: '0 11,15,21 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: painel
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Puxar dados do Notion
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          META_MES: '50'
          META_MAILA: '70'
          META_PETTERSON: '30'
          META_ANTECEDENCIA: '30'
        run: python fetch_notion.py

      - name: Gerar o painel
        run: python gerar_dashboard.py cards.json index.html

      - name: Commitar se algo mudou
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html cards.json
          if git diff --staged --quiet; then
            echo "Nada mudou desde a última rodada — sem commit."
          else
            git commit -m "Painel atualizado: $(TZ=America/Sao_Paulo date '+%d/%m/%Y às %H:%M')"
            git push
          fi
